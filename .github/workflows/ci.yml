name: CI

# Quand : à chaque PR, et à chaque push sur main
on:
  pull_request:
  push:
    branches: [main]

# Le robot peut seulement lire le dépôt
permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérifier le formatage
        run: npm run format:check

      - name: Tests unitaires et couverture
        run: npm run test:coverage
